AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate service with ALB for UGC Video Orchestrator

Parameters:
  AppName:
    Type: String
    Default: teems-ugc-video
  ContainerImage:
    Type: String
    Description: Full ECR image URI (including tag) for UGC Video Orchestrator
  ContainerPort:
    Type: Number
    Default: 8000
  DesiredCount:
    Type: Number
    Default: 1
  HealthCheckPath:
    Type: String
    Default: /health
  DatabaseUrl:
    Type: String
    Default: ""
    Description: PostgreSQL database URL (asyncpg format)
  AWSRegion:
    Type: String
    Default: eu-north-1
    Description: AWS region for S3 and other services
  S3BucketName:
    Type: String
    Default: ""
    Description: S3 bucket name for asset storage
  S3FolderPrefix:
    Type: String
    Default: UGC_Agent
    Description: S3 folder prefix for organizing assets
  AIMLApiKey:
    Type: String
    Default: ""
    Description: AIML API key for GPT-5.2 and other AI services
  OpenAIApiKey:
    Type: String
    Default: ""
    Description: OpenAI API key (optional, for direct OpenAI access)
  LangChainApiKey:
    Type: String
    Default: ""
    Description: LangSmith API key for tracing
  LangChainProject:
    Type: String
    Default: ugc-orchestrator
    Description: LangSmith project name
  LipsyncApiKey:
    Type: String
    Default: ""
    Description: Sync API key for lipsync feature (optional)
  Auth0Domain:
    Type: String
    Default: ""
    Description: Auth0 domain (required for auth)
  Auth0Audience:
    Type: String
    Default: ""
    Description: Auth0 API audience (required for auth)
  Auth0Algorithm:
    Type: String
    Default: RS256
    Description: Auth0 token algorithm
  CORSAllowedOrigins:
    Type: String
    Default: ""
    Description: Comma-separated list of allowed CORS origins (optional, defaults to localhost + env var)
  SSLCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for this service's HTTPS listener
  SharedVPCId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID from brandfetch stack (shared VPC)
  SharedSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 1 ID from brandfetch stack
  SharedSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 2 ID from brandfetch stack

Conditions:
  HasSSLCertificate: !Not [!Equals [!Ref SSLCertificateArn, ""]]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AppName}-cluster"

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Access to ALB for UGC Video Orchestrator
      VpcId: !Ref SharedVPCId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Access for ECS tasks
      VpcId: !Ref SharedVPCId
      SecurityGroupIngress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 65535
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AppName}-alb"
      Scheme: internet-facing
      Subnets:
        - !Ref SharedSubnet1Id
        - !Ref SharedSubnet2Id
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AppName}-tg"
      VpcId: !Ref SharedVPCId
      TargetType: ip
      Port: !Ref ContainerPort
      Protocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200-399"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasSSLCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              Host: "#{host}"
              Path: "/#{path}"
              Query: "#{query}"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasSSLCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref SSLCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-task-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"
                  - !Sub "arn:aws:s3:::${S3BucketName}"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"
                  - !Sub "arn:aws:s3:::${S3BucketName}"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AppName}"
      RetentionInDays: 14

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - LogGroup
    Properties:
      Family: !Sub "${AppName}-task"
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${AppName}-container"
          Image: !Ref ContainerImage
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Essential: true
          Environment:
            - Name: ENV
              Value: production
            - Name: LOG_LEVEL
              Value: info
            - Name: DATABASE_URL
              Value: !Ref DatabaseUrl
            - Name: AWS_REGION
              Value: !Ref AWSRegion
            - Name: S3_BUCKET_NAME
              Value: !Ref S3BucketName
            - Name: S3_FOLDER_PREFIX
              Value: !Ref S3FolderPrefix
            - Name: AIML_API_KEY
              Value: !Ref AIMLApiKey
            - Name: OPENAI_API_KEY
              Value: !Ref OpenAIApiKey
            - Name: LANGCHAIN_API_KEY
              Value: !Ref LangChainApiKey
            - Name: LANGCHAIN_TRACING_V2
              Value: "true"
            - Name: LANGCHAIN_PROJECT
              Value: !Ref LangChainProject
            - Name: LIPSYNC_API_KEY
              Value: !Ref LipsyncApiKey
            - Name: CORS_ALLOWED_ORIGINS
              Value: !Ref CORSAllowedOrigins
            - Name: AUTH0_DOMAIN
              Value: !Ref Auth0Domain
            - Name: AUTH0_AUDIENCE
              Value: !Ref Auth0Audience
            - Name: AUTH0_ALGORITHM
              Value: !Ref Auth0Algorithm
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${AppName}"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - Listener
    Properties:
      ServiceName: !Sub "${AppName}-service"
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets:
            - !Ref SharedSubnet1Id
            - !Ref SharedSubnet2Id
      LoadBalancers:
        - ContainerName: !Sub "${AppName}-container"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup

Outputs:
  LoadBalancerDNS:
    Description: Public DNS name for the Application Load Balancer
    Value: !GetAtt LoadBalancer.DNSName
