AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate service for DB Automation (idle connection terminator) - No ALB needed

Parameters:
  AppName:
    Type: String
    Default: teems-db-automation
  ContainerImage:
    Type: String
    Description: Full ECR image URI (including tag) for DB Automation service
  DesiredCount:
    Type: Number
    Default: 1
    Description: Only 1 instance needed for this service
  DatabaseUrl:
    Type: String
    Description: PostgreSQL database URL (postgresql://user:pass@host:5432/dbname)
  IdleThresholdMinutes:
    Type: Number
    Default: 10
    Description: Terminate connections idle longer than this (minutes)
  CheckIntervalMinutes:
    Type: Number
    Default: 30
    Description: How often to check for idle connections (minutes)
  DryRun:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Set to true to log only without terminating connections
  ExcludedUsers:
    Type: String
    Default: "rdsadmin"
    Description: Comma-separated list of database users to never terminate
  SharedVPCId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID from existing stack (shared VPC)
  SharedSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 1 ID from existing stack
  SharedSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 2 ID from existing stack

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AppName}-cluster"

  # Security group - only needs outbound access to RDS
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for DB Automation ECS tasks
      VpcId: !Ref SharedVPCId
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-task-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AppName}"
      RetentionInDays: 14

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - LogGroup
    Properties:
      Family: !Sub "${AppName}-task"
      # Minimal resources - this is a lightweight service
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${AppName}-container"
          Image: !Ref ContainerImage
          Essential: true
          Environment:
            - Name: DATABASE_URL
              Value: !Ref DatabaseUrl
            - Name: IDLE_THRESHOLD_MINUTES
              Value: !Ref IdleThresholdMinutes
            - Name: CHECK_INTERVAL_MINUTES
              Value: !Ref CheckIntervalMinutes
            - Name: DRY_RUN
              Value: !Ref DryRun
            - Name: EXCLUDED_USERS
              Value: !Ref ExcludedUsers
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${AppName}"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # No ALB needed - this is an internal scheduled service
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${AppName}-service"
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets:
            - !Ref SharedSubnet1Id
            - !Ref SharedSubnet2Id

Outputs:
  ClusterName:
    Description: ECS Cluster name
    Value: !Ref Cluster
  ServiceName:
    Description: ECS Service name
    Value: !GetAtt Service.Name
  LogGroupName:
    Description: CloudWatch Log Group for viewing service logs
    Value: !Ref LogGroup
