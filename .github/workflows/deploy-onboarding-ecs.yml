name: Deploy Onboarding Service to ECS

on:
  push:
    branches:
      - main
    paths:
      - 'services/onboarding-service/**'
      - 'infra/ecs-onboarding-stack.yaml'
      - '.github/workflows/deploy-onboarding-ecs.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  APP_NAME: teems-onboarding
  ECR_REPOSITORY: teems-onboarding
  CLOUD_FORMATION_STACK: teems-onboarding-ecs

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          set -e
          if ! aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "${ECR_REPOSITORY}" >/dev/null
          fi

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          LATEST_URI="${REGISTRY}/${ECR_REPOSITORY}:latest"

          docker build \
            -f services/onboarding-service/Dockerfile \
            -t "${IMAGE_URI}" \
            -t "${LATEST_URI}" \
            .

          docker push "${IMAGE_URI}"
          docker push "${LATEST_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Check and cleanup failed stack (if in ROLLBACK_COMPLETE)
        run: |
          set -e
          # Check if stack exists
          if ! aws cloudformation describe-stacks --stack-name "${CLOUD_FORMATION_STACK}" >/dev/null 2>&1; then
            echo "Stack does not exist, nothing to clean up"
            exit 0
          fi

          # Get stack status
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${CLOUD_FORMATION_STACK}" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "")

          if [[ -z "${STACK_STATUS}" ]]; then
            echo "Could not determine stack status, skipping cleanup"
            exit 0
          fi

          echo "Current stack status: ${STACK_STATUS}"

          if [[ "${STACK_STATUS}" != "ROLLBACK_COMPLETE" ]]; then
            echo "Stack is not in ROLLBACK_COMPLETE state, no cleanup needed"
            exit 0
          fi

          echo "Stack is in ROLLBACK_COMPLETE state. Deleting stack before redeployment..."
          aws cloudformation delete-stack --stack-name "${CLOUD_FORMATION_STACK}"

          echo "Waiting for stack deletion to complete (max 10 minutes)..."
          MAX_WAIT=600
          ELAPSED=0
          POLL_INTERVAL=15

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # Check if stack still exists
            if ! aws cloudformation describe-stacks --stack-name "${CLOUD_FORMATION_STACK}" >/dev/null 2>&1; then
              echo "Stack deleted successfully"
              exit 0
            fi

            # Get current status
            CURRENT_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "${CLOUD_FORMATION_STACK}" \
              --query "Stacks[0].StackStatus" \
              --output text 2>/dev/null || echo "")

            if [[ -z "${CURRENT_STATUS}" ]]; then
              echo "Stack deleted successfully (no longer exists)"
              exit 0
            fi

            echo "  [${ELAPSED}s] Deletion in progress: ${CURRENT_STATUS}"

            # Check for completion states
            if [[ "${CURRENT_STATUS}" == "DELETE_COMPLETE" ]]; then
              echo "Stack deletion completed"
              exit 0
            fi

            # If status changed to something unexpected, log and continue
            if [[ "${CURRENT_STATUS}" != *"DELETE"* ]] && [[ "${CURRENT_STATUS}" != *"ROLLBACK"* ]]; then
              echo "Stack status changed to ${CURRENT_STATUS}, assuming deletion completed"
              exit 0
            fi

            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          # Final check - if stack still exists, warn but continue
          if aws cloudformation describe-stacks --stack-name "${CLOUD_FORMATION_STACK}" >/dev/null 2>&1; then
            echo "Warning: Stack deletion still in progress after timeout. Proceeding anyway..."
          else
            echo "Stack deletion completed"
          fi

      - name: Wait for stack to be ready (if exists)
        timeout-minutes: 20
        run: |
          set -e
          if aws cloudformation describe-stacks --stack-name "${CLOUD_FORMATION_STACK}" >/dev/null 2>&1; then
            echo "Stack exists, checking status..."
            STACK_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "${CLOUD_FORMATION_STACK}" \
              --query "Stacks[0].StackStatus" \
              --output text)
            
            echo "Current stack status: ${STACK_STATUS}"
            
            # Wait if stack is in progress (with timeout)
            if [[ "${STACK_STATUS}" == *"IN_PROGRESS"* ]]; then
              echo "Stack is ${STACK_STATUS}, waiting for completion (max 20 minutes)..."
              MAX_WAIT=1200  # 20 minutes in seconds
              ELAPSED=0
              POLL_INTERVAL=30  # Check every 30 seconds
              
              while [ $ELAPSED -lt $MAX_WAIT ]; do
                CURRENT_STATUS=$(aws cloudformation describe-stacks \
                  --stack-name "${CLOUD_FORMATION_STACK}" \
                  --query "Stacks[0].StackStatus" \
                  --output text 2>/dev/null || echo "UNKNOWN")
                
                echo "  [${ELAPSED}s] Stack status: ${CURRENT_STATUS}"
                
                if [[ ! "${CURRENT_STATUS}" == *"IN_PROGRESS"* ]]; then
                  echo "Stack reached stable state: ${CURRENT_STATUS}"
                  break
                fi
                
                sleep $POLL_INTERVAL
                ELAPSED=$((ELAPSED + POLL_INTERVAL))
              done
              
              # Final status check
              FINAL_STATUS=$(aws cloudformation describe-stacks \
                --stack-name "${CLOUD_FORMATION_STACK}" \
                --query "Stacks[0].StackStatus" \
                --output text)
              
              if [[ "${FINAL_STATUS}" == *"IN_PROGRESS"* ]]; then
                echo "Warning: Stack still in progress after timeout. Proceeding anyway..."
              else
                echo "Stack is now: ${FINAL_STATUS}"
              fi
            else
              echo "Stack is already in stable state: ${STACK_STATUS}"
            fi
          else
            echo "Stack does not exist yet, will create new stack"
          fi

      - name: Check SSL Certificate configuration
        env:
          SSL_CERTIFICATE_ARN: ${{ secrets.SSL_CERTIFICATE_ARN || secrets.ONBOARDING_SSL_CERTIFICATE_ARN }}
        run: |
          if [[ -n "${SSL_CERTIFICATE_ARN}" ]]; then
            echo "✓ SSL Certificate ARN is configured - HTTPS will be enabled"
            echo "Certificate ARN: ${SSL_CERTIFICATE_ARN:0:50}..."
          else
            echo "⚠ SSL Certificate ARN is not set - HTTPS will be disabled (HTTP only)"
            echo "To enable HTTPS, add SSL_CERTIFICATE_ARN or ONBOARDING_SSL_CERTIFICATE_ARN to GitHub secrets"
          fi

      - name: Deploy CloudFormation stack (network, cluster, ALB, ECS service)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.ONBOARDING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL || secrets.ONBOARDING_REDIS_URL }}
          AIML_API_KEY: ${{ secrets.AIML_API_KEY || secrets.ONBOARDING_AIML_API_KEY }}
          AIML_BASE_URL: ${{ secrets.AIML_BASE_URL || 'https://api.aimlapi.com/v1' }}
          DEFAULT_LLM_MODEL: ${{ secrets.DEFAULT_LLM_MODEL || 'openai/gpt-4o-mini' }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN || secrets.ONBOARDING_AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE || secrets.ONBOARDING_AUTH0_AUDIENCE }}
          AUTH0_ALGORITHM: ${{ secrets.AUTH0_ALGORITHM || secrets.ONBOARDING_AUTH0_ALGORITHM || 'RS256' }}
          BRANDFETCH_API_URL: ${{ secrets.BRANDFETCH_API_URL || 'http://teems-brandfetch-alb-default.us-east-1.elb.amazonaws.com' }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || secrets.ONBOARDING_CORS_ALLOWED_ORIGINS || '' }}
          SSL_CERTIFICATE_ARN: ${{ secrets.SSL_CERTIFICATE_ARN || secrets.ONBOARDING_SSL_CERTIFICATE_ARN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.ONBOARDING_OPENAI_API_KEY }}
        run: |
          set -e
          aws cloudformation deploy \
            --stack-name "${CLOUD_FORMATION_STACK}" \
            --template-file infra/ecs-onboarding-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              AppName="${APP_NAME}" \
              ContainerImage="${IMAGE_URI}" \
              ContainerPort=8080 \
              DesiredCount=1 \
              HealthCheckPath="/health" \
              DatabaseUrl="${DATABASE_URL:-}" \
              RedisUrl="${REDIS_URL:-}" \
              AIMLApiKey="${AIML_API_KEY:-}" \
              AIMLBaseUrl="${AIML_BASE_URL:-https://api.aimlapi.com/v1}" \
              DefaultLLMModel="${DEFAULT_LLM_MODEL:-openai/gpt-4o-mini}" \
              Auth0Domain="${AUTH0_DOMAIN:-}" \
              Auth0Audience="${AUTH0_AUDIENCE:-}" \
              Auth0Algorithm="${AUTH0_ALGORITHM:-RS256}" \
              BrandfetchApiUrl="${BRANDFETCH_API_URL:-}" \
              CORSAllowedOrigins="${CORS_ALLOWED_ORIGINS:-}" \
              SSLCertificateArn="${SSL_CERTIFICATE_ARN:-}" \
              OpenAIApiKey="${OPENAI_API_KEY:-}" \
            --no-fail-on-empty-changeset

      - name: Show stack events on failure
        if: failure()
        run: |
          echo "=== CloudFormation Stack Events (last 20) ==="
          aws cloudformation describe-stack-events \
            --stack-name "${CLOUD_FORMATION_STACK}" \
            --max-items 20 \
            --query "StackEvents[*].[Timestamp,ResourceType,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true
          
          echo ""
          echo "=== Stack Status ==="
          aws cloudformation describe-stacks \
            --stack-name "${CLOUD_FORMATION_STACK}" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true
          
          echo ""
          echo "=== Failed Resources ==="
          aws cloudformation describe-stack-events \
            --stack-name "${CLOUD_FORMATION_STACK}" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED'].[LogicalResourceId,ResourceStatusReason]" \
            --output table || true

      - name: Output service URL
        id: stack-output
        run: |
          DNS_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${CLOUD_FORMATION_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDNS'].OutputValue" \
            --output text)
          echo "SERVICE_URL=https://${DNS_NAME}" >> "$GITHUB_OUTPUT"
          echo "Service is available at: https://${DNS_NAME}"

      - name: Print service URL
        run: |
          echo "Onboarding service endpoint URL: ${{ steps.stack-output.outputs.SERVICE_URL }}"

