name: Deploy Agent Manager to ECS

on:
  push:
    branches:
      - main
    paths:
      - 'services/agent-manager/**'
      - 'infra/ecs-agent-manager-stack.yaml'
      - '.github/workflows/deploy-agent-manager-ecs.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  APP_NAME: teems-agent-manager
  ECR_REPOSITORY: teems-agent-manager
  CLOUD_FORMATION_STACK: teems-agent-manager-ecs

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          set -e
          if ! aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "${ECR_REPOSITORY}" >/dev/null
          fi

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          LATEST_URI="${REGISTRY}/${ECR_REPOSITORY}:latest"

          docker build \
            -f services/agent-manager/Dockerfile \
            -t "${IMAGE_URI}" \
            -t "${LATEST_URI}" \
            .

          docker push "${IMAGE_URI}"
          docker push "${LATEST_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Check and cleanup failed stack (if in ROLLBACK_COMPLETE)
        run: |
          set -e
          if aws cloudformation describe-stacks --stack-name "${CLOUD_FORMATION_STACK}" >/dev/null 2>&1; then
            STACK_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "${CLOUD_FORMATION_STACK}" \
              --query "Stacks[0].StackStatus" \
              --output text)

            echo "Current stack status: ${STACK_STATUS}"

            if [[ "${STACK_STATUS}" == "ROLLBACK_COMPLETE" ]]; then
              echo "Stack is in ROLLBACK_COMPLETE state. Deleting stack before redeployment..."
              aws cloudformation delete-stack --stack-name "${CLOUD_FORMATION_STACK}"
              echo "Waiting for stack deletion to complete (max 10 minutes)..."
              MAX_WAIT=600
              ELAPSED=0
              POLL_INTERVAL=15

              while [ $ELAPSED -lt $MAX_WAIT ]; do
                if ! aws cloudformation describe-stacks --stack-name "${CLOUD_FORMATION_STACK}" >/dev/null 2>&1; then
                  echo "Stack deleted successfully"
                  break
                fi

                CURRENT_STATUS=$(aws cloudformation describe-stacks \
                  --stack-name "${CLOUD_FORMATION_STACK}" \
                  --query "Stacks[0].StackStatus" \
                  --output text 2>/dev/null || echo "DELETED")

                echo "  [${ELAPSED}s] Deletion in progress: ${CURRENT_STATUS}"

                if [[ "${CURRENT_STATUS}" == "DELETED" ]] || [[ ! "${CURRENT_STATUS}" == *"DELETE"* ]]; then
                  echo "Stack deletion completed"
                  break
                fi

                sleep $POLL_INTERVAL
                ELAPSED=$((ELAPSED + POLL_INTERVAL))
              done

              if aws cloudformation describe-stacks --stack-name "${CLOUD_FORMATION_STACK}" >/dev/null 2>&1; then
                echo "Warning: Stack deletion still in progress after timeout. Proceeding anyway..."
              fi
            fi
          fi

      - name: Wait for stack to be ready (if exists)
        timeout-minutes: 20
        run: |
          set -e
          if aws cloudformation describe-stacks --stack-name "${CLOUD_FORMATION_STACK}" >/dev/null 2>&1; then
            echo "Stack exists, checking status..."
            STACK_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "${CLOUD_FORMATION_STACK}" \
              --query "Stacks[0].StackStatus" \
              --output text)

            echo "Current stack status: ${STACK_STATUS}"

            if [[ "${STACK_STATUS}" == *"IN_PROGRESS"* ]]; then
              echo "Stack is ${STACK_STATUS}, waiting for completion (max 20 minutes)..."
              MAX_WAIT=1200
              ELAPSED=0
              POLL_INTERVAL=30

              while [ $ELAPSED -lt $MAX_WAIT ]; do
                CURRENT_STATUS=$(aws cloudformation describe-stacks \
                  --stack-name "${CLOUD_FORMATION_STACK}" \
                  --query "Stacks[0].StackStatus" \
                  --output text 2>/dev/null || echo "UNKNOWN")

                echo "  [${ELAPSED}s] Stack status: ${CURRENT_STATUS}"

                if [[ ! "${CURRENT_STATUS}" == *"IN_PROGRESS"* ]]; then
                  echo "Stack reached stable state: ${CURRENT_STATUS}"
                  break
                fi

                sleep $POLL_INTERVAL
                ELAPSED=$((ELAPSED + POLL_INTERVAL))
              done

              FINAL_STATUS=$(aws cloudformation describe-stacks \
                --stack-name "${CLOUD_FORMATION_STACK}" \
                --query "Stacks[0].StackStatus" \
                --output text)

              if [[ "${FINAL_STATUS}" == *"IN_PROGRESS"* ]]; then
                echo "Warning: Stack still in progress after timeout. Proceeding anyway..."
              else
                echo "Stack is now: ${FINAL_STATUS}"
              fi
            else
              echo "Stack is already in stable state: ${STACK_STATUS}"
            fi
          else
            echo "Stack does not exist yet, will create new stack"
          fi

      - name: Deploy CloudFormation stack
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.AGENT_MANAGER_DATABASE_URL }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN || secrets.AGENT_MANAGER_AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE || secrets.AGENT_MANAGER_AUTH0_AUDIENCE }}
          AUTH0_ALGORITHM: ${{ secrets.AUTH0_ALGORITHM || secrets.AGENT_MANAGER_AUTH0_ALGORITHM }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || secrets.AGENT_MANAGER_CORS_ALLOWED_ORIGINS || '' }}
        run: |
          set -e
          aws cloudformation deploy \
            --stack-name "${CLOUD_FORMATION_STACK}" \
            --template-file infra/ecs-agent-manager-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              AppName="${APP_NAME}" \
              ContainerImage="${IMAGE_URI}" \
              ContainerPort=8080 \
              DesiredCount=1 \
              HealthCheckPath="/health" \
              DatabaseUrl="${DATABASE_URL:-}" \
              Auth0Domain="${AUTH0_DOMAIN:-}" \
              Auth0Audience="${AUTH0_AUDIENCE:-}" \
              Auth0Algorithm="${AUTH0_ALGORITHM:-RS256}" \
              CORSAllowedOrigins="${CORS_ALLOWED_ORIGINS:-}" \
            --no-fail-on-empty-changeset

      - name: Output service URL
        id: stack-output
        run: |
          DNS_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${CLOUD_FORMATION_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDNS'].OutputValue" \
            --output text)
          echo "SERVICE_URL=http://${DNS_NAME}" >> "$GITHUB_OUTPUT"
          echo "Service is available at: http://${DNS_NAME}"

      - name: Print service URL
        run: |
          echo "Agent Manager endpoint URL: ${{ steps.stack-output.outputs.SERVICE_URL }}"

